<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <title>Yokobo AR Chat Cat (Pseudo AR)</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <!-- AR Scene -->
  <a-scene
  id="ar-scene"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; maxDetectionRate: 30;"
>
    <a-assets>
      <a-asset-item id="cat-gltf" src="./models/cat2.glb"></a-asset-item>
    </a-assets>
    <!--
      Original pattern marker for displaying the 3D model.
      マーカー画像 (markers/design.png) と組み合わせて配置する想定。
    -->
    <a-marker
      id="design-marker"
      type="pattern"
      url="./markers/design.patt"
      smooth="true"
      smoothCount="12"
      smoothTolerance="0.02"
      smoothThreshold="6"
    >
      <a-entity
        id="catRoot"
        position="0 -0.02 -0.06"
        rotation="-130 0 0"
        scale="5 5 5"
      >
        <!--
          猫がマーカーより前に飛び出さず、机上で起きた姿勢に見えるように調整。
          position: 手前に出すぎない程度にZを小さく/高さを微調整。
          rotation: 机に置いたマーカーを上から見ても立って見える向き。
          scale: モデルの高さ基準で約5倍。
        -->
        <a-entity id="cat-entity" gltf-model="#cat-gltf"></a-entity>
      </a-entity>
    </a-marker>
    <a-entity camera look-controls="enabled: false"></a-entity>
  </a-scene>

  <!-- UI -->
  <div id="hud">
    <!--
      オリジナルマーカー画像の参考表示。
      画面上の参考配置。名刺/紙面ではマーカーとして利用する想定。
    -->
    <img
      id="design-icon"
      src="./markers/design.png"
      width="32"
      height="32"
      alt="オリジナルマーカー画像"
    />
    <div id="chatbar">
      <input id="q" type="text" placeholder="猫に質問してみて…" autocomplete="off" />
      <button id="send">送信</button>
    </div>

    <div id="stage">
      <div id="bubble" class="hidden"></div>
      <div id="fx" class="hidden"></div>
      <div id="flowers" class="hidden" aria-hidden="true"></div>
      <div id="face" class="hidden"></div>
      <button id="new-chat" type="button">
        <span class="paw" aria-hidden="true">🐾</span>
        <span class="label">New</span>
      </button>
    </div>

    <div id="panel">
      <div id="log"></div>
    </div>
  </div>


  <script type="module" src="./main.js"></script>
</body>
</html>
